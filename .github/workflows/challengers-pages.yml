# Deploys the ChaLLengErs web app (challengers/web) to GitHub Pages for free.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy ChaLLengErs to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["challengers/**", ".github/workflows/challengers-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: node challengers/build.mjs
      - name: Prepare site
        run: |
          mkdir -p site
          cp -r challengers/web/* site/
          cp challengers/dist/challengers.html site/offline.html
          cd challengers/extension && zip -qr ../../site/challengers-extension.zip . && cd ../..
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
